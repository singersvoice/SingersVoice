# Fly.io: `fly launch --copy-config --no-deploy` once, `fly secrets set RELAY_SECRET=…`, then `fly deploy`.
# The machine stops when no stream has run for a while and starts again on the first request
# (the first segment of a show waits a second or two for it) — so an idle relay costs nothing.
app = "singersvoice-relay"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  RELAY_MAX_STREAMS = "20"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

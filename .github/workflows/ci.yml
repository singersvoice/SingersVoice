name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build · budget · secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (npm 12 avoids the npm 10 workspace peer-set bug)
        run: |
          npm i -g npm@12
          npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: sv-control boots on Node (type stripping + node:sqlite)
        run: node tools/ci/control-smoke.mjs

      - name: Build web (GitHub Pages base)
        env:
          BASE_PATH: /SingersVoice/
        run: npm run build

      - name: First-load budget (400 KB gz)
        run: node tools/ci/check-budget.mjs apps/web/dist 400

      - name: Secret scan (no credentials in the repo)
        run: |
          set -e
          # Google API keys and OAuth client secrets, private keys, Stripe keys and webhook secrets, GitHub and Fly tokens, Meta access tokens, X bearer tokens.
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}|[0-9]+-[0-9a-z]{32}\.apps\.googleusercontent\.com|GOCSPX-[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|(sk|rk)_(live|test)_[0-9A-Za-z]{20,}|whsec_[0-9A-Za-z]{20,}|ghp_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{30,}|(fo1|fm2)_[0-9A-Za-z_-]{30,}|EAA[0-9A-Za-z]{80,}|AAAAAAAAAAAAAAAAAAAAA[0-9A-Za-z%]{40,}' -- ':!package-lock.json' ; then
            echo "::error::Possible credential committed"; exit 1; fi
          echo "no credentials found"

      - name: Viewport screenshots (320→1280, device mode + stage e2e)
        env:
          BASE_PATH: /SingersVoice/
          SV_E2E_JSON: apps/web/test/fixtures/sample.track.json
          SV_E2E_AUDIO: apps/web/test/fixtures/sample.mp3
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/ci/screenshots.mjs screenshots

      - name: The audience's player, measured (Opus batches → one continuous sound at 48 and 44.1 kHz)
        run: node tools/ci/mix-lab.mjs

      - name: The vocal rider, measured (a microphone's hiss never riden up; a voice brought to the target, the floor kept under it)
        run: node tools/ci/rider-lab.mjs

      - name: The watch page's player, measured (the browser's own muxer on real H.264 + AAC → hls.js plays it, with sound and without)
        run: node tools/ci/hls-lab.mjs

      - name: YouTube song tracks in the browser (the search through the real relay with a stub yt-dlp; a track's karaoke video on the song's clock)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/yt-track-e2e.mjs screenshots

      - name: Track search and the track database (the All tab, Sing-time copies into the singer's Drive, sorting, the song tree, unavailable links)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/tracks-e2e.mjs screenshots

      - name: The first sign-in with Google faked (the Drive box left unticked is "One more tick", never an error; a fresh token's refusal asked again; the folders made)
        run: node tools/ci/signin-e2e.mjs screenshots

      - name: Coupons (the gate on who may use SingersVoice: a singer out until the coupon issued to their address is entered; the code or the date changed by the admin puts them out at once; the gate off)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/coupons-e2e.mjs screenshots

      - name: Roles and plans (a free singer with the voice alone, SVV putting the picture on stage, the hours metered and used up, the plans priced, a club and its members, a club owner's plan granted, expired, renewed, revoked; a USB input beside the mic)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/roles-e2e.mjs screenshots

      - name: The Studio's stage (the voice zoom live and in the saved file, eased; the Camera & zoom sheet during the song; the Sound sheet's preview and Save; the NONE background; the saved performance half as big again as the show stage; one capture per visit on an iPhone, the setup's one question, a blocked camera told)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/studio-e2e.mjs screenshots

      - name: Every screen fits a phone (320→820 px at every text size: nothing wider than the window; the stage keeps its Start button and readable lyrics on screen)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/fit-e2e.mjs screenshots

      - name: Joining a performance (a Studio take with the singer's cut-out beside the show, opened for others; a free account joins it from the link with the camera on, a third joins the second's, three on one stage; the owner sees who joined; closing)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/join-e2e.mjs screenshots

      - name: The TV in the room (a screen with no sign-in shows its code and QR; a Studio singer types it and the TV shows her stage — the words on top, the picture below, the clock running; disconnected; the QR's door)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/tv-e2e.mjs screenshots

      - name: Social (a take kept opens the clip sheet; a section picked and the clip made in the browser and downloaded; X and Facebook & Instagram connected through stand-in sign-in pages, the Page picked; a clip posted to all three with the links back; X let go)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/social-e2e.mjs screenshots

      - name: Load and chaos (three singers on one stage, every link's sound and picture verified from its counters, the service's rows counted, the service killed for 20 s and back, a tab closed without a word, End meet twice)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/load-e2e.mjs screenshots 3

      - name: Live meet with two performers on one stage (cut-outs, WebRTC relay, cued pause/resume, the film in chapters, nothing mirrored, the sound measured)
        env:
          BASE_PATH: /SingersVoice/
        run: node tools/ci/live-duet.mjs screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 14

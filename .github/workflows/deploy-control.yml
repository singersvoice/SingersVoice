name: Deploy sv-control (Cloudflare Workers)

# One-time setup (repo → Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN — the plain "Edit Cloudflare Workers" token template is enough
#              (the SVT DB is a SQLite Durable Object inside the worker; nothing else to provision)
#              CLOUDFLARE_ACCOUNT_ID
#              PUBLISH_KEY_SECRET (optional; a new worker gets a generated one that stays on the worker)
#   Variables: VITE_GOOGLE_CLIENT_ID (also used as the token audience), PRIVILEGED_EMAILS (comma list)
# After a successful run the workflow re-runs "Deploy web" with the worker URL so the app picks it up
# ("Deploy web" can also discover the URL from the Cloudflare account on its own).

on:
  push:
    branches: [main]
    paths:
      - 'services/control/**'
      - 'packages/protocol/**'
      - 'tools/cf/**'
      - '.github/workflows/deploy-control.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: control
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.SKIP_CONTROL_DEPLOY != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm i -g npm@12
          npm ci --no-audit --no-fund
      - name: Tests
        run: npm test -w services/control
      - name: Check Cloudflare secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — skipping the deploy (add it to deploy sv-control)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare
        if: steps.check.outputs.ready == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLISH_KEY_SECRET: ${{ secrets.PUBLISH_KEY_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          PRIVILEGED_EMAILS: ${{ vars.PRIVILEGED_EMAILS }}
          ALLOWED_ORIGINS: https://singersvoice.github.io,https://${{ github.repository_owner }}.github.io
        run: node tools/cf/deploy.mjs
      - name: Point the web app at the service and redeploy it
        if: steps.check.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Best effort only: the workflow token usually may not write repo variables. Not needed —
          # "Deploy web" gets the URL as an input below and can also discover it from Cloudflare.
          gh variable set VITE_CONTROL_URL --body "$URL" --repo "$GITHUB_REPOSITORY" 2>/dev/null \
            && echo "VITE_CONTROL_URL variable set to $URL" \
            || echo "VITE_CONTROL_URL variable not set (no permission) — fine, Deploy web discovers the URL itself."
          gh workflow run deploy-web.yml --repo "$GITHUB_REPOSITORY" -f control_url="$URL" \
            || echo "::warning::Could not trigger Deploy web — run it from the Actions tab (it will find $URL on its own)"
          echo "sv-control is live at $URL"

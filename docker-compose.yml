# Local control plane for live meets (the static web app can run without it).
#   docker compose up --build
services:
  control:
    build:
      context: .
      dockerfile: services/control/Dockerfile
    ports:
      - '8787:8787'
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173,https://singersvoice.github.io
    restart: unless-stopped
